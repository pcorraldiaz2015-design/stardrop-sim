<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stardrop Simulator - Fixed Duplicate</title>
    <style>
        body {
            background: radial-gradient(circle, #2c3e50 0%, #000000 100%);
            color: white; font-family: 'Arial Black', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; overflow: hidden;
            padding: 10px; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }

        .hud {
            position: absolute; top: 10px; background: rgba(0,0,0,0.85);
            padding: 10px 20px; border-radius: 15px; border: 2px solid #ffd700;
            text-align: center; width: 90%; max-width: 300px; z-index: 20;
        }
        .coins { color: #ffd700; font-size: 1.5rem; margin: 0; }
        .title-display { color: #00ffff; font-size: 1rem; text-transform: uppercase; margin-top: 2px; }

        #stardrop-container {
            position: relative; cursor: pointer; transition: transform 0.1s;
            width: 70vw; height: 70vw; max-width: 320px; max-height: 320px;
            display: flex; align-items: center; justify-content: center;
            margin: 20px 0;
            touch-action: none; 
        }
        #stardrop-container:active { transform: scale(0.9); }

        #stardrop-img {
            width: 100%; height: auto;
            filter: drop-shadow(0 0 20px #56de1e);
            transition: filter 0.3s ease;
            pointer-events: none;
        }

        .rarity-label {
            font-size: 2.5rem; text-transform: uppercase; margin-bottom: 5px;
            text-shadow: 3px 3px #000; font-style: italic; z-index: 5;
        }

        .progress-container {
            width: 100%; background: #333; height: 8px; border-radius: 4px;
            margin-top: 5px; overflow: hidden; border: 1px solid #555;
        }
        #progress-fill { height: 100%; background: #00ffff; width: 0%; transition: width 0.3s; }

        .shop { margin-top: 10px; z-index: 30; text-align: center; }
        .buffie-btn {
            background: #ff4b2b; color: white; border: 2px solid white;
            padding: 10px 20px; border-radius: 12px; font-weight: bold; 
            cursor: pointer; font-size: 1rem;
        }

        @media (max-height: 500px) and (orientation: landscape) {
            body { flex-direction: row; justify-content: space-around; padding-top: 50px; }
            .hud { width: 180px; top: 10px; left: 10px; }
            #stardrop-container { width: 40vh; height: 40vh; }
            .rarity-label { font-size: 1.8rem; position: absolute; bottom: 10px; }
            .shop { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); }
        }
    </style>
</head>
<body>

    <div class="hud">
        <p class="coins" id="coin-display">0 💰</p>
        <div class="title-display" id="player-title">NOOB</div>
        <div class="progress-container"><div id="progress-fill"></div></div>
        <small id="xp-text" style="color: #aaa; font-size: 0.6rem;">Faltan 1500 para el próximo título</small>
    </div>

    <div id="rarity-text" class="rarity-label" style="color: #56de1e;">RARE</div>

    <div id="stardrop-container">
        <img src="Starr-Drop-1.png" id="stardrop-img" alt="Starr Drop">
    </div>

    <div class="shop">
        <button class="buffie-btn" id="buffie-btn">BUFFIE x2 (100 💰)</button>
        <div id="timer" style="display:none; color: #ffcc00; font-size: 0.9rem;">¡SUERTE! <span id="secs">300</span>s</div>
    </div>

    <script>
        let coins = 0;
        let lifetimeTotal = 0;
        let isbuffieActive = false;
        let lastInteractionTime = 0; // Para evitar duplicados

        const rarities = [
            { name: "Rare", chance: 55.4, val: 10, color: "#56de1e" },
            { name: "Ultrarare", chance: 25, val: 35, color: "#0084ff" },
            { name: "Epic", chance: 10, val: 100, color: "#d320ff" },
            { name: "Mithic", chance: 4, val: 350, color: "#ff2a2a" },
            { name: "Legendary", chance: 0.5, val: 1200, color: "#ffcc00" },
            { name: "Ultra", chance: 5.0, val: 4000, color: "#ffffff" },
            { name: "Special", chance: 0.1, val: 10000, color: "#00ffff" }
        ];

        const titles = ["Noob", "Normal", "Good", "Epic player", "Legendary player", "Pro", "King", "Legend", "GOD"];

        function handleInteraction(e) {
            // BLOQUEO DE DUPLICADOS: Si hubo una acción hace menos de 200ms, ignoramos esta
            const now = Date.now();
            if (now - lastInteractionTime < 200) return;
            lastInteractionTime = now;

            // Si es un toque de móvil, evitamos que luego se dispare el evento de ratón
            if (e.type === 'touchstart') {
                e.preventDefault(); 
            }

            let roll = Math.random() * 100;
            let luckMult = isbuffieActive ? 3 : 1;
            let win = rarities[0];

            for (let i = rarities.length - 1; i >= 0; i--) {
                if (roll <= rarities[i].chance * luckMult) {
                    win = rarities[i];
                    break;
                }
            }

            coins += win.val;
            lifetimeTotal += win.val;
            
            document.getElementById('coin-display').innerText = coins + " 💰";
            document.getElementById('rarity-text').innerText = win.name;
            document.getElementById('rarity-text').style.color = win.color;
            document.getElementById('stardrop-img').style.filter = `drop-shadow(0 0 35px ${win.color})`;

            updateProgression();
        }

        function updateProgression() {
            let rankIdx = Math.floor(lifetimeTotal / 1500);
            if(rankIdx >= titles.length) rankIdx = titles.length - 1;
            document.getElementById('player-title').innerText = titles[rankIdx];

            let currentXP = lifetimeTotal % 1500;
            let percent = (currentXP / 1500) * 100;
            document.getElementById('progress-fill').style.width = percent + "%";
            document.getElementById('xp-text').innerText = `Faltan ${1500 - currentXP} para el próximo título`;
        }

        function handleBuffie(e) {
            const now = Date.now();
            if (now - lastInteractionTime < 200) return;
            lastInteractionTime = now;
            
            e.stopPropagation();

            if (coins >= 100 && !isbuffieActive) {
                coins -= 100;
                isbuffieActive = true;
                document.getElementById('coin-display').innerText = coins + " 💰";
                document.getElementById('buffie-btn').disabled = true;
                document.getElementById('timer').style.display = 'block';
                
                let time = 300;
                let clock = setInterval(() => {
                    time--;
                    document.getElementById('secs').innerText = time;
                    if(time <= 0) {
                        clearInterval(clock);
                        isbuffieActive = false;
                        document.getElementById('buffie-btn').disabled = false;
                        document.getElementById('timer').style.display = 'none';
                    }
                }, 1000);
            }
        }

        const dropContainer = document.getElementById('stardrop-container');
        const btnBuffie = document.getElementById('buffie-btn');

        // Escuchamos ambos pero la función handleInteraction filtrará los duplicados
        dropContainer.addEventListener('mousedown', handleInteraction);
        dropContainer.addEventListener('touchstart', handleInteraction, {passive: false});

        btnBuffie.addEventListener('click', handleBuffie);
        btnBuffie.addEventListener('touchstart', handleBuffie, {passive: false});

    </script>
</body>
</html>
