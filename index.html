<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stardrop Simulator - Responsive Buffie</title>
    
    <link rel="icon" type="image/jpeg" href="photo-output.jpeg">
    <link rel="apple-touch-icon" href="photo-output.jpeg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Stardrop Sim">

    <style>
        body {
            background: radial-gradient(circle, #2c3e50 0%, #000000 100%);
            color: white; font-family: 'Arial Black', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; overflow: hidden;
            padding: 10px; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
            transition: background 0.4s ease; 
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
        }

        #main-menu {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 500; background: inherit;
            gap: 20px;
        }

        #update-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            background: #444; 
            color: white;
            border: 3px solid #000;
            padding: 15px 35px; 
            font-family: 'Arial Black', sans-serif;
            border-radius: 40px;
            font-size: 1.5rem; 
            cursor: pointer;
            transition: transform 0.2s ease, background 0.3s, border 0.3s;
            z-index: 600;
            display: block;
        }
        #update-btn:hover { transform: scale(1.1); }
        #update-btn:active { transform: scale(0.95); }
        
        #update-btn.has-update {
            background: #004488;
            color: white;
            border: 4px solid #ffd700;
        }

        .menu-header {
            display: flex; align-items: center; justify-content: center; 
            gap: 15px; margin-bottom: 20px; transform: translateY(-30px);
            width: 100%; flex-wrap: nowrap; 
        }
        .menu-title {
            font-size: 6rem; color: white;
            margin: 0; text-align: center; white-space: nowrap;
        }
        .side-stardrop { width: 100px; height: auto; flex-shrink: 0; }

        #play-btn, .coming-soon-btn {
            background: #444; 
            color: white;
            border: 3px solid #000; padding: 25px 70px;
            font-family: 'Arial Black', sans-serif; border-radius: 60px;
            font-size: 2.8rem; cursor: pointer; display: flex; align-items: center; gap: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); 
            transition: transform 0.2s ease;
            width: fit-content;
        }
        #play-btn:hover, .coming-soon-btn:hover { transform: scale(1.05); } 
        #play-btn:active, .coming-soon-btn:active { transform: scale(0.95); }
        
        /* CAMBIOS SOLICITADOS: SATURACIÓN Y BRILLO */
        .coming-soon-btn {
            filter: saturate(40%) brightness(75%);
        }

        .mini-stardrop { width: 55px; height: auto; }

        #game-content { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; }

        @keyframes ultraGlow {
            0% { background-color: #ff7f50; }
            25% { background-color: #ff8c00; }
            50% { background-color: #ffb6c1; }
            75% { background-color: #dda0dd; }
            100% { background-color: #ff7f50; }
        }
        @keyframes blink {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.6; transform: scale(1.5); }
        }
        @keyframes fastSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes clickBounce {
            0% { transform: scale(1); }
            30% { transform: scale(1.2, 0.8); }
            60% { transform: scale(0.8, 1.2); }
            100% { transform: scale(1); }
        }

        .ultra-bg-active { animation: ultraGlow 3s infinite alternate; background-blend-mode: overlay; }
        .spin-animation { animation: fastSpin 0.5s ease-in-out; }
        .bounce-animation { animation: bounce 3s ease-in-out infinite; }
        .click-animation { animation: clickBounce 0.4s ease-out; }

        #ultra-flashes {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: none; z-index: 1;
        }
        .flash { 
            position: absolute; background: white; border-radius: 50%; 
            filter: blur(60px); opacity: 0; animation: blink 2s infinite; 
        }
        .ultra-bg-active #ultra-flashes { display: block; }

        .corner-hud {
            position: absolute; top: 20px; background: rgba(0,0,0,0.85);
            padding: 12px 25px; border-radius: 18px; border: 3px solid #ffd700;
            z-index: 20; display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 48%; box-sizing: border-box;
        }
        #left-hud { left: 20px; min-width: 140px; }
        #right-hud { right: 20px; min-width: 140px; }

        #end-screen {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95); padding: 30px; border-radius: 20px;
            border: 4px solid #ffd700; z-index: 200; text-align: center;
            display: none; box-shadow: 0 0 50px rgba(255, 215, 0, 0.4);
            max-width: 80%;
        }

        #restart-btn {
            background: #444; color: white; border: 2px solid #000; padding: 10px 20px;
            font-family: 'Arial Black', sans-serif; border-radius: 10px;
            font-size: 1.2rem; cursor: pointer; margin-top: 15px;
        }

        #bottom-controls {
            display: flex; align-items: center; justify-content: center;
            gap: 20px; margin-top: 15px; width: 100%;
        }

        #sound-toggle {
            cursor: pointer; width: 35px; height: 35px;
            display: flex; align-items: center; justify-content: center;
        }
        #sound-toggle svg { fill: white; width: 100%; height: 100%; filter: drop-shadow(0 0 2px black); }

        #back-to-menu {
            cursor: pointer; width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s;
        }
        #back-to-menu:active { transform: scale(0.8); }
        #back-to-menu svg { fill: white; width: 100%; height: 100%; filter: drop-shadow(0 0 2px black); }

        .level-up-active {
            top: 50% !important; right: 50% !important;
            transform: translate(50%, -50%) scale(2);
            z-index: 100; background: rgba(0, 0, 0, 0.95);
            border-color: #00ffff; box-shadow: 0 0 100px rgba(0, 255, 255, 0.5);
        }
        .can-close { cursor: pointer !important; }

        .coins { color: #ffd700; font-size: 2rem; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .title-display { color: #00ffff; font-size: 1.4rem; text-transform: uppercase; display: flex; align-items: center; gap: 8px; white-space: nowrap; }

        .progress-container {
            width: 100%; background: #333; height: 8px; border-radius: 4px;
            margin-top: 8px; overflow: hidden; border: 1px solid #555;
        }
        #progress-fill { height: 100%; background: #00ffff; width: 0%; transition: width 0.3s; }

        #stardrop-container {
            position: relative; cursor: pointer;
            width: 70vw; height: 70vw; max-width: 320px; max-height: 320px;
            display: flex; align-items: center; justify-content: center;
            margin: 20px 0; z-index: 10;
        }
        .blocked { pointer-events: none; opacity: 0.5; filter: grayscale(1); }
        #stardrop-img { width: 100%; height: auto; transition: filter 0.3s ease; pointer-events: none; }
        
        .rarity-label { font-size: 2.8rem; text-transform: uppercase; font-style: italic; z-index: 5; text-align: center; }
        .ultra-text-size { font-size: 3.5rem !important; }

        #left-hud-main { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 10px; }
        #buffie-wrapper { display: flex; flex-direction: column; align-items: center; min-width: 60px; flex-shrink: 0; }
        #buffie-status { color: #00ff00; font-size: 0.7rem; font-weight: bold; visibility: hidden; margin-bottom: 2px; }
        #shop-image-container { position: relative; cursor: pointer; width: 70px; height: 70px; transition: all 0.3s; overflow: hidden; border-radius: 10px; }
        #shop-image-container:active { transform: scale(0.9); }
        #shop-image-container.disabled { filter: grayscale(1); opacity: 0.6; cursor: not-allowed; }
        #shop-image-img { width: 100%; height: 100%; display: block; object-fit: contain; }
        #timer { color: #ffcc00; font-size: 1rem; display: none; }

        @media (max-width: 600px) {
            .corner-hud { padding: 8px 12px; top: 10px; }
            #left-hud { left: 10px; }
            #right-hud { right: 10px; }
            .coins { font-size: 1.4rem; }
            .title-display { font-size: 0.9rem; }
            #shop-image-container { width: 55px; height: 55px; }
            #buffie-wrapper { min-width: 55px; }
            .menu-title { font-size: 2.5rem; }
            .side-stardrop { width: 50px; }
            .menu-header { gap: 10px; transform: translateY(-10px); }
            #play-btn, .coming-soon-btn { font-size: 1.8rem; padding: 15px 40px; }
            #update-btn { top: 10px; right: 10px; font-size: 1.1rem; padding: 10px 20px; }
        }
    </style>
</head>
<body>

    <div id="main-menu">
        <button id="update-btn">Actualizar</button>
        <div class="menu-header">
            <img src="Starr-Drop-1.png" class="side-stardrop" alt="Drop Izq">
            <h1 class="menu-title">Starr Games</h1>
            <img src="Starr-Drop-1.png" class="side-stardrop" alt="Drop Der">
        </div>
        <button id="play-btn">
            Normal <img src="Starr-Drop-1.png" class="mini-stardrop" alt="Drop">
        </button>
        <button class="coming-soon-btn">
            Proximamente... <img src="Icono_Starr_Drop_Competitivo.png" class="mini-stardrop" alt="Coming Soon">
        </button>
    </div>

    <div id="game-content">
        <div id="ultra-flashes"></div>

        <div id="end-screen">
            <h2 style="color: #ffd700; margin-top: 0;">¡FELICIDADES!</h2>
            <p>Te has pasado el juego.</p>
            <button id="restart-btn">REINICIAR TODO</button>
        </div>

        <div class="corner-hud" id="left-hud">
            <div id="left-hud-main">
                <p class="coins" id="coin-display">0 💰</p>
                <div id="buffie-wrapper">
                    <div id="buffie-status">¡Activo!</div>
                    <div id="shop-image-container" class="disabled">
                        <img src="noFilter.webp" id="shop-image-img" alt="Buffie">
                    </div>
                    <div id="timer"><span id="secs">150</span>s</div>
                </div>
            </div>

            <div id="bottom-controls">
                <div id="sound-toggle">
                    <svg id="sound-icon" viewBox="0 0 24 24">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                </div>
                <div id="back-to-menu">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                    </svg>
                </div>
            </div>
        </div>

        <div class="corner-hud" id="right-hud">
            <div class="title-display"><span>🏅</span> <span id="player-title">NOOB</span></div>
            <div class="progress-container"><div id="progress-fill"></div></div>
            <small id="xp-text" style="color: #aaa; font-size: 0.7rem; margin-top: 5px;">Faltan 1500</small>
        </div>

        <div id="rarity-text" class="rarity-label" style="color: #56de1e;">RARE</div>

        <div id="stardrop-container" class="bounce-animation">
            <img src="Starr-Drop-1.png" id="stardrop-img" alt="Starr Drop">
        </div>
    </div>

    <script>
        const updateBtn = document.getElementById('update-btn');
        async function checkForUpdates() {
            try {
                const response = await fetch(window.location.href, { method: 'HEAD', cache: 'no-cache' });
                const etag = response.headers.get('etag');
                const lastSavedEtag = localStorage.getItem('last-etag');
                if (lastSavedEtag && etag && lastSavedEtag !== etag) { updateBtn.classList.add('has-update'); }
                if (etag) localStorage.setItem('last-etag', etag);
            } catch (e) { console.log("Error checking update"); }
        }
        updateBtn.addEventListener('click', () => { window.location.reload(true); });
        checkForUpdates();

        const mainMenu = document.getElementById('main-menu');
        const gameContent = document.getElementById('game-content');
        const playBtn = document.getElementById('play-btn');
        const backBtn = document.getElementById('back-to-menu');

        playBtn.addEventListener('click', () => {
            mainMenu.style.display = 'none';
            gameContent.style.display = 'flex';
            if (audioCtx.state === 'suspended') audioCtx.resume();
            playSoundEffect('start');
        });

        backBtn.addEventListener('click', () => {
            stopMusic();
            document.body.classList.remove('ultra-bg-active');
            document.body.style.background = "radial-gradient(circle, #2c3e50 0%, #000000 100%)";
            gameContent.style.display = 'none';
            mainMenu.style.display = 'flex';
        });

        const flashContainer = document.getElementById('ultra-flashes');
        for (let i = 0; i < 15; i++) {
            const flash = document.createElement('div');
            flash.className = 'flash';
            flash.style.width = Math.random() * 200 + 100 + 'px';
            flash.style.height = flash.style.width;
            flash.style.left = Math.random() * 100 + '%';
            flash.style.top = Math.random() * 100 + '%';
            flash.style.animationDelay = Math.random() * 3 + 's';
            flashContainer.appendChild(flash);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let musicInterval = null, step = 0, isMuted = false;

        function playSynthNote(freq, type, duration, volume) {
            if (isMuted) return; 
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playUltraMusic() {
            if (isMuted) return;
            const melody = [329.63, 392.00, 523.25, 493.88, 329.63, 392.00, 523.25, 587.33];
            const bass = [130.81, 130.81, 130.81, 130.81, 164.81, 164.81, 164.81, 164.81];
            playSynthNote(melody[step % melody.length], 'triangle', 0.6, 0.1);
            playSynthNote(bass[step % bass.length], 'sawtooth', 0.4, 0.05);
            step++;
        }

        function playSoundEffect(type) {
            if (isMuted) return;
            if (type === 'tap') playSynthNote(440, 'sine', 0.1, 0.2);
            else if (type === 'start') {
                playSynthNote(523.25, 'sine', 0.3, 0.1);
                setTimeout(() => playSynthNote(659.25, 'sine', 0.4, 0.1), 100);
            }
            else if (type === 'levelup') {
                [261, 329, 392, 523].forEach((f, i) => {
                    setTimeout(() => playSynthNote(f, 'square', 0.5, 0.1), i * 100);
                });
            }
        }

        const soundBtn = document.getElementById('sound-toggle'), soundIcon = document.getElementById('sound-icon');
        const mutePath = "M4.34 2.93L2.93 4.34 7.29 8.7 7 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81l2.91 2.91 1.41-1.41L4.34 2.93zM10 15.17L7.83 13H5v-2h2.83l.88-.88L10 11.41v3.76zM19 12c0-1.77-1.02-3.29-2.5-4.03V5.62c2.89.86 5 3.54 5 6.71 0 1.17-.26 2.28-.73 3.27l-1.45-1.45c.11-.37.18-.75.18-1.15zM16.5 12c0-.06-.01-.11-.01-.17l-1.49-1.49v3.32c1.07-.46 1.5-1.15 1.5-1.66zM12 4L9.91 6.09 12 8.18V4z";
        const soundPath = "M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z";

        soundBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isMuted = !isMuted;
            soundIcon.innerHTML = `<path d="${isMuted ? mutePath : soundPath}"/>`;
            if (isMuted) stopMusic();
        });

        let coins = 0, lifetimeTotal = 0, isbuffieActive = false, buffieCount = 0;
        let isLevelingUp = false, canCloseLevelUp = false, lastInteractionTime = 0, currentRankIdx = 0, gameFinished = false;
        let lastRarityName = "", consecutiveRarityCount = 0;

        const rarities = [
            { name: "Rare", chance: 50.4, val: 8.5, color: "#56de1e", bgColor: "#1c2e0a" },
            { name: "Super Rare", chance: 28.2, val: 30, color: "#0084ff", bgColor: "#002b55" },
            { name: "Epic", chance: 12.0, val: 85, color: "#d320ff", bgColor: "#440055" },
            { name: "Mythic", chance: 6.0, val: 300, color: "#ff2a2a", bgColor: "#550000" },
            { name: "Legendary", chance: 2.5, val: 1020, color: "#ffcc00", bgColor: "#554400" },
            { name: "Ultra", chance: 0.8, val: 3400, color: "#ffffff", bgColor: "ultra-special" },
            { name: "Special", chance: 0.1, val: 8500, color: "#00ffff", bgColor: "#004444" }
        ];

        const titles = ["Noob", "Normal", "Good", "Epic player", "Legendary player", "Pro", "King", "Legend", "GOD"];
        let currentVisibleWin = rarities[0];
        const stardropImg = document.getElementById('stardrop-img'), stardropContainer = document.getElementById('stardrop-container');
        const rightHud = document.getElementById('right-hud'), rarityText = document.getElementById('rarity-text');
        const shopImgBtnContainer = document.getElementById('shop-image-container');

        function startMusic() { if (musicInterval || isMuted) return; step = 0; musicInterval = setInterval(playUltraMusic, 250); }
        function stopMusic() { clearInterval(musicInterval); musicInterval = null; }

        function handleInteraction(e) {
            if (isLevelingUp || gameFinished) return;
            const now = Date.now();
            if (now - lastInteractionTime < 200) return;
            lastInteractionTime = now;
            if (e.type === 'touchstart') e.preventDefault(); 

            playSoundEffect('tap');
            stopMusic();
            document.body.classList.remove('ultra-bg-active');
            stardropImg.classList.remove('spin-animation');
            rarityText.classList.remove('ultra-text-size');

            stardropContainer.classList.remove('click-animation');
            void stardropContainer.offsetWidth; 
            stardropContainer.classList.add('click-animation');

            coins += currentVisibleWin.val; lifetimeTotal += currentVisibleWin.val;
            updateUI(); updateProgression();

            let nextWin, isValidRoll = false;
            while (!isValidRoll) {
                let roll = Math.random() * 100, luckMult = isbuffieActive ? 3 : 1;
                let potentialWin = rarities[0];
                for (let i = rarities.length - 1; i >= 0; i--) {
                    if (roll <= rarities[i].chance * luckMult) { potentialWin = rarities[i]; break; }
                }
                if (potentialWin.name === lastRarityName) {
                    if (consecutiveRarityCount < 3) { nextWin = potentialWin; consecutiveRarityCount++; isValidRoll = true; }
                } else {
                    nextWin = potentialWin; lastRarityName = nextWin.name; consecutiveRarityCount = 1; isValidRoll = true;
                }
            }

            currentVisibleWin = nextWin;
            rarityText.innerText = currentVisibleWin.name;
            rarityText.style.color = currentVisibleWin.color;
            stardropImg.style.filter = `drop-shadow(0 0 35px ${currentVisibleWin.color})`;

            if (currentVisibleWin.name === "Ultra") {
                document.body.classList.add('ultra-bg-active');
                stardropImg.classList.add('spin-animation');
                rarityText.classList.add('ultra-text-size');
                startMusic();
            } else {
                document.body.style.background = `radial-gradient(circle, ${currentVisibleWin.bgColor} 0%, #000000 100%)`;
            }
        }

        function updateUI() {
            document.getElementById('coin-display').innerText = Math.floor(coins).toLocaleString() + " 💰";
            let cost = buffieCount === 0 ? 150 : (buffieCount === 1 ? 27000 : 30000);
            if (coins < cost || isbuffieActive) shopImgBtnContainer.classList.add('disabled');
            else shopImgBtnContainer.classList.remove('disabled');
        }

        function updateProgression() {
            let accumulatedXP = 0, rankIdx = 0;
            for (let i = 0; i < titles.length; i++) {
                let costOfThisLevel = 1500 + (i * 555);
                if (lifetimeTotal >= accumulatedXP + costOfThisLevel) {
                    accumulatedXP += costOfThisLevel; rankIdx = i + 1;
                } else {
                    let currentLevelXP = lifetimeTotal - accumulatedXP;
                    let xpNeededForNext = costOfThisLevel;
                    document.getElementById('progress-fill').style.width = (currentLevelXP / xpNeededForNext) * 100 + "%";
                    document.getElementById('xp-text').innerText = `Faltan ${Math.ceil(xpNeededForNext - currentLevelXP).toLocaleString()}`;
                    break;
                }
            }
            if (rankIdx >= titles.length - 1) {
                rankIdx = titles.length - 1;
                if (!gameFinished) {
                    gameFinished = true;
                    document.getElementById('end-screen').style.display = 'block';
                    stardropContainer.classList.add('blocked');
                }
            }
            if (rankIdx > currentRankIdx && !gameFinished) { triggerLevelUpAnimation(); playSoundEffect('levelup'); }
            currentRankIdx = rankIdx;
            document.getElementById('player-title').innerText = titles[rankIdx];
        }

        function triggerLevelUpAnimation() {
            isLevelingUp = true; canCloseLevelUp = false;
            rightHud.classList.add('level-up-active');
            stardropContainer.classList.add('blocked');
            setTimeout(() => { canCloseLevelUp = true; rightHud.classList.add('can-close'); }, 1000);
            setTimeout(closeLevelUp, 4000);
        }

        function closeLevelUp() {
            if (!isLevelingUp) return;
            isLevelingUp = false;
            rightHud.classList.remove('level-up-active', 'can-close');
            if (!gameFinished) stardropContainer.classList.remove('blocked');
        }

        function restartGame() {
            coins = 0; lifetimeTotal = 0; buffieCount = 0;
            isbuffieActive = false; gameFinished = false;
            currentRankIdx = 0; lastRarityName = ""; consecutiveRarityCount = 0;
            document.getElementById('end-screen').style.display = 'none';
            stardropContainer.classList.remove('blocked');
            document.getElementById('timer').style.display = 'none';
            document.getElementById('buffie-status').style.visibility = 'hidden';
            currentVisibleWin = rarities[0];
            rarityText.innerText = currentVisibleWin.name;
            rarityText.style.color = currentVisibleWin.color;
            document.body.style.background = `radial-gradient(circle, ${currentVisibleWin.bgColor} 0%, #000000 100%)`;
            updateUI(); updateProgression();
        }

        rightHud.addEventListener('click', () => { if (canCloseLevelUp) closeLevelUp(); });
        document.getElementById('restart-btn').addEventListener('click', restartGame);

        shopImgBtnContainer.addEventListener('click', (e) => {
            if (shopImgBtnContainer.classList.contains('disabled') || gameFinished || isLevelingUp) return;
            e.stopPropagation();
            let cost = buffieCount === 0 ? 150 : (buffieCount === 1 ? 27000 : 30000);
            if (coins >= cost && !isbuffieActive) {
                coins -= cost; isbuffieActive = true; buffieCount++;
                updateUI(); document.getElementById('timer').style.display = 'block';
                document.getElementById('buffie-status').style.visibility = 'visible';
                let time = 150;
                document.getElementById('secs').innerText = time;
                let clock = setInterval(() => {
                    time--; document.getElementById('secs').innerText = time;
                    if(time <= 0 || gameFinished) { 
                        clearInterval(clock); isbuffieActive = false; 
                        document.getElementById('timer').style.display = 'none'; 
                        document.getElementById('buffie-status').style.visibility = 'hidden';
                        updateUI(); 
                    }
                }, 1000);
            }
        });

        stardropContainer.addEventListener('mousedown', handleInteraction);
        stardropContainer.addEventListener('touchstart', handleInteraction, {passive: false});
        updateUI(); updateProgression();
    </script>
</body>
</html>
